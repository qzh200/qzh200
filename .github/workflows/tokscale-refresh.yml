name: Refresh Tokscale Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Tokscale SVG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets

          curl -fLsS --retry 3 --retry-delay 5 --max-time 120 \
            -A "Mozilla/5.0" \
            -H "Accept: image/svg+xml" \
            "https://tokscale.ai/api/embed/qzh200/svg?cost=full&graph=1&rank=total&tokens=full" \
            -o assets/tokscale.svg

          test -s assets/tokscale.svg

          if ! grep -Eiq '<svg([[:space:]>])' assets/tokscale.svg; then
            echo "Invalid SVG response"
            head -c 500 assets/tokscale.svg
            exit 1
          fi

      - name: Commit refreshed card
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/tokscale.svg

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh Tokscale card"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitAscii profile
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run gitascii.yml --ref main

name: Refresh Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download HoyoCard SVGs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/hoyocard

          for type in gs sr; do
            curl -fLsS --retry 3 -A "Mozilla/5.0" \
              "https://hoyocard.qhy04.com/${type}/detail/rand/422551225.png" \
              -o "/tmp/hoyocard/${type}.svg"

            if ! grep -Eiq '<svg([[:space:]>])' "/tmp/hoyocard/${type}.svg"; then
              echo "Invalid SVG response: ${type}"
              head -c 500 "/tmp/hoyocard/${type}.svg"
              exit 1
            fi
          done

      - name: Render HoyoCard PNGs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/hoyocard-render
          cd /tmp/hoyocard-render
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

          cat > render.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-dev-shm-usage']
          });

          try {
            for (const type of ['gs', 'sr']) {
              const page = await browser.newPage({
                viewport: { width: 500, height: 165 },
                deviceScaleFactor: 2
              });

              page.setDefaultNavigationTimeout(60000);

              await page.goto(
                pathToFileURL(resolve(`/tmp/hoyocard/${type}.svg`)).href,
                { waitUntil: 'load', timeout: 60000 }
              );

              await page.evaluate(async () => {
                await document.fonts.ready;
              });

              await page.screenshot({
                path: `${process.env.GITHUB_WORKSPACE}/assets/hoyocard-${type}.png`,
                type: 'png',
                animations: 'disabled',
                fullPage: false,
                timeout: 120000
              });

              console.log(`Successfully converted: ${type}`);

              await page.close();
            }
          } finally {
            await browser.close();
          }
          EOF

          node render.mjs

      - name: Download Tokscale SVG
        shell: bash
        run: |
          set -euo pipefail

          curl -fLsS --retry 3 --retry-delay 5 --max-time 120 \
            -A "Mozilla/5.0" \
            -H "Accept: image/svg+xml" \
            "https://tokscale.ai/api/embed/qzh200/svg?cost=full&graph=1&rank=total&tokens=full" \
            -o assets/tokscale.svg

          test -s assets/tokscale.svg

          if ! grep -Eiq '<svg([[:space:]>])' assets/tokscale.svg; then
            echo "Invalid SVG response"
            head -c 500 assets/tokscale.svg
            exit 1
          fi

      - name: Verify refreshed assets
        shell: bash
        run: |
          set -euo pipefail

          file "${GITHUB_WORKSPACE}/assets/hoyocard-gs.png" "${GITHUB_WORKSPACE}/assets/hoyocard-sr.png"

          test -s "${GITHUB_WORKSPACE}/assets/hoyocard-gs.png"
          test -s "${GITHUB_WORKSPACE}/assets/hoyocard-sr.png"

      - name: Commit refreshed assets
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh profile assets"
          file_pattern: assets/hoyocard-gs.png assets/hoyocard-sr.png assets/tokscale.svg
          branch: main
          skip_fetch: true
          skip_checkout: true
          before_push_hook: git pull --rebase origin main

      - name: Rebuild GitAscii profile
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run gitascii.yml --ref main

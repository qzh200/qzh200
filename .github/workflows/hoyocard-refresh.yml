
name: Refresh HoyoCard Images

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download HoyoCard SVG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets /tmp/hoyocard

          curl -fLsS --retry 3 -A "Mozilla/5.0" \
            "https://hoyocard.qhy04.com/gs/detail/rand/422551225.png" \
            -o /tmp/hoyocard/gs.svg

          curl -fLsS --retry 3 -A "Mozilla/5.0" \
            "https://hoyocard.qhy04.com/sr/detail/rand/422551225.png" \
            -o /tmp/hoyocard/sr.svg

          for type in gs sr; do
            if ! grep -Eiq '<svg([[:space:]>])' "/tmp/hoyocard/${type}.svg"; then
              echo "Invalid SVG response: ${type}"
              head -c 500 "/tmp/hoyocard/${type}.svg"
              exit 1
            fi
          done

      - name: Install Chromium
        run: |
          mkdir -p /tmp/hoyocard-render
          cd /tmp/hoyocard-render
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Convert SVG to PNG
        run: |
          cat > /tmp/hoyocard-render/render.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const browser = await chromium.launch({
            headless: true
          });

          for (const type of ['gs', 'sr']) {
            const page = await browser.newPage({
              viewport: {
                width: 500,
                height: 165
              },
              deviceScaleFactor: 2
            });

            await page.goto(
              pathToFileURL(
                resolve(`/tmp/hoyocard/${type}.svg`)
              ).href,
              { waitUntil: 'load' }
            );

            await page.screenshot({
              path: `${process.env.GITHUB_WORKSPACE}/assets/hoyocard-${type}.png`,
              fullPage: true
            });

            await page.close();
          }

          await browser.close();
          EOF

          node /tmp/hoyocard-render/render.mjs

      - name: Verify PNG files
        run: |
          file assets/hoyocard-gs.png
          file assets/hoyocard-sr.png

          test -s assets/hoyocard-gs.png
          test -s assets/hoyocard-sr.png

      - name: Commit refreshed images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/hoyocard-gs.png assets/hoyocard-sr.png

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh HoyoCard images"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitAscii profile
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run gitascii.yml --ref main
